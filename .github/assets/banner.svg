<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="InHayat / LifeBridge — transplantatsiyaga tayyorgarlik platformasi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#e3f3ee"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d8f7a"/>
      <stop offset="1" stop-color="#0f5f55"/>
    </linearGradient>
    <style>
      .serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
      .sans{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}
      .pulse{stroke-dasharray:900;animation:draw 3.2s ease-in-out infinite}
      @keyframes draw{0%{stroke-dashoffset:900}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
      .beat{animation:beat 1.6s ease-in-out infinite;transform-origin:1010px 170px}
      @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
      .dot{animation:fade 2.4s ease-in-out infinite}
      @keyframes fade{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <circle cx="1160" cy="20" r="150" fill="#cfeee5" opacity=".7"/>
  <circle cx="40" cy="330" r="90" fill="#d9f0e9" opacity=".8"/>

  <!-- logo -->
  <rect x="64" y="48" width="44" height="44" rx="12" fill="url(#teal)"/>
  <path d="M86 82 l-11-11 a7 7 0 0 1 11-9 a7 7 0 0 1 11 9z" fill="#fff"/>
  <path d="M75 70 h6 l3-5 l4 9 l3-4 h5" fill="none" stroke="#1d8f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="80" class="sans" font-size="26" font-weight="700" fill="#16403a">Life<tspan fill="#1d8f7a">Bridge</tspan></text>
  <text x="264" y="80" class="sans" font-size="16" fill="#6b7f7a">· InHayat.uz</text>

  <text x="64" y="160" class="serif" font-size="50" font-weight="700" fill="#10251f">Sog‘ayish yo‘lingizni</text>
  <text x="64" y="218" class="serif" font-size="50" font-weight="700" fill="#10251f"><tspan font-style="italic" fill="#1d8f7a">yaqinroq</tspan> qilamiz.</text>
  <text x="64" y="262" class="sans" font-size="19" fill="#4b5d58">Transplantatsiyaga tayyorgarlik · bemor sayti · shifokorlar portali · AI nazoratchi</text>

  <!-- chips -->
  <g class="sans" font-size="13" font-weight="600">
    <rect x="64" y="284" width="96" height="28" rx="14" fill="#fff" stroke="#bfe3d8"/><text x="80" y="303" fill="#0f5f55">Next.js 15</text>
    <rect x="168" y="284" width="92" height="28" rx="14" fill="#fff" stroke="#bfe3d8"/><text x="184" y="303" fill="#0f5f55">Supabase</text>
    <rect x="268" y="284" width="118" height="28" rx="14" fill="#fff" stroke="#bfe3d8"/><text x="284" y="303" fill="#0f5f55">Cloudflare R2</text>
    <rect x="394" y="284" width="108" height="28" rx="14" fill="#fff" stroke="#bfe3d8"/><text x="410" y="303" fill="#0f5f55">Claude AI</text>
  </g>

  <!-- heart + ECG -->
  <g class="beat">
    <circle cx="1010" cy="170" r="104" fill="#fff" stroke="#bfe3d8" stroke-width="2"/>
    <path d="M1010 228 l-52-52 a32 32 0 0 1 52-40 a32 32 0 0 1 52 40z" fill="url(#teal)"/>
  </g>
  <path class="pulse" d="M620 170 H880 l14-34 l18 74 l16-58 l12 18 H1140" fill="none" stroke="#1d8f7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <circle class="dot" cx="1140" cy="170" r="6" fill="#1d8f7a"/>
</svg>
